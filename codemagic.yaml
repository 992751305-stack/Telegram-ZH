# codemagic.yaml —— 免费 macOS 构建 Telegram-iOS + 自动汉化补丁
#
# 触发：Codemagic 控制台 Start new build，或往 main 推 commit
# 免费额度：500 分钟/月（macOS 按 2x 计费，实际约 250 分钟）

workflows:
  telegram-zh:
    name: Telegram ZH (AutoZH patch)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        TELEGRAM_REPO: "https://github.com/TelegramMessenger/Telegram-iOS.git"
        WORKDIR: "/Users/builder/telegram-build"

    scripts:
      - name: 环境自检
        script: |
          set -e
          sw_vers
          xcodebuild -version
          python3 --version
          df -h /
          echo "PWD=$(pwd)"
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "FCI_BUILD_DIR=$FCI_BUILD_DIR"

      - name: 克隆 Telegram-iOS
        script: |
          set -e
          rm -rf "$WORKDIR"
          git clone --recursive --depth 1 "$TELEGRAM_REPO" "$WORKDIR"
          cd "$WORKDIR"
          git log -1 --format='%H %ci'
          echo "--- submodules 检查 ---"
          ls -d submodules/TelegramUI submodules/TranslateUI submodules/TelegramCore

      - name: 应用自动汉化补丁
        script: |
          set -e
          SRC="$(pwd)/patch/apply_patch.py"
          echo "补丁来源: $SRC"
          ls -la "$SRC"
          cp "$SRC" "$WORKDIR/apply_patch.py"
          cd "$WORKDIR"
          ls -d submodules
          python3 "$WORKDIR/apply_patch.py"
          echo "--- 补丁验证 ---"
          grep -c "AutoZH" submodules/TranslateUI/Sources/Translate.swift
          grep -c "AutoZH" submodules/TranslateUI/Sources/ChatTranslation.swift
          grep -c "AutoZH" submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode/Sources/ChatMessageTextBubbleContentNode.swift

      - name: 写入构建配置
        script: |
          set -e
          cd "$WORKDIR"
          mkdir -p build-system/Make
          cat > build-system/Make/Configuration.json <<EOF
          {
            "apiId": "${TG_API_ID}",
            "apiHash": "${TG_API_HASH}",
            "bundleId": "com.local.telegramzh",
            "teamId": "",
            "appCenterAppName": "",
            "appCenterAppSecret": "",
            "displayName": "TG-ZH"
          }
          EOF
          cat build-system/Make/Configuration.json

      - name: 编译
        script: |
          set -e
          cd "$WORKDIR"
          python3 build-system/Make/Make.py \
            --cacheDir="$WORKDIR/.bazel-cache" \
            build --buildNumber=$BUILD_NUMBER \
            --configuration=release_universal

      - name: 打包 IPA
        script: |
          set -e
          cd "$WORKDIR"
          mkdir -p out
          if ls build/artifacts/*.ipa >/dev/null 2>&1; then
            cp build/artifacts/*.ipa out/
          else
            APP=$(find build -maxdepth 6 -name '*.app' -type d | grep -v Framework | head -1)
            echo "APP=$APP"
            if [ -n "$APP" ]; then
              mkdir -p out/Payload
              cp -R "$APP" out/Payload/
              cd out && zip -qry TelegramZH.ipa Payload
            fi
          fi
          ls -lah out/

    artifacts:
      - /Users/builder/telegram-build/out/*.ipa
      - /Users/builder/telegram-build/build/artifacts/*.ipa

    publishing:
      email:
        recipients:
          - 992751305-stack@users.noreply.github.com
        notify:
          success: true
          failure: true
