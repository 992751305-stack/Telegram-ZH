workflows:
  telegram-zh:
    name: Telegram ZH (AutoZH patch)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        TELEGRAM_REPO: "https://github.com/TelegramMessenger/Telegram-iOS.git"
        WORKDIR: "/Users/builder/telegram-build"

    scripts:
      - name: 环境自检
        script: |
          set -e
          sw_vers
          xcodebuild -version
          python3 --version
          df -h /
          echo "PWD=$(pwd)"
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"

      - name: 克隆 Telegram-iOS
        script: |
          set -e
          rm -rf "$WORKDIR"
          git clone --recursive --depth 1 "$TELEGRAM_REPO" "$WORKDIR"
          cd "$WORKDIR"
          git log -1 --format='%H %ci'
          echo "--- submodules 检查 ---"
          ls -d submodules/TelegramUI submodules/TranslateUI submodules/TelegramCore

      - name: 应用自动汉化补丁
        script: |
          set -e
          SRC="$(pwd)/patch/apply_patch.py"
          echo "补丁来源: $SRC"
          echo "WORKDIR: $WORKDIR"
          cd "$WORKDIR"
          pwd
          ls -d submodules
          echo "--- 执行补丁 (AUTOZH_ROOT=$WORKDIR) ---"
          AUTOZH_ROOT="$WORKDIR" python3 "$SRC"
          echo "--- 补丁验证 ---"
          grep -c "AutoZH" submodules/TranslateUI/Sources/Translate.swift
          grep -c "AutoZH" submodules/TranslateUI/Sources/ChatTranslation.swift
          grep -c "AutoZH" submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode/Sources/ChatMessageTextBubbleContentNode.swift

      - name: 修正 Xcode 版本要求
        script: |
          set -e
          cd "$WORKDIR"
          echo "=== 原 versions.json ==="
          cat versions.json
          echo ""
          echo "=== 探测本机 Xcode ==="
          xcodebuild -version
          XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          MACOS_VER=$(sw_vers -productVersion | cut -d. -f1)
          echo "本机 Xcode=$XCODE_VER macOS=$MACOS_VER"
          cat > versions.json <<EOF
          {
              "app": "13.2",
              "xcode": "$XCODE_VER",
              "deploy_xcode": "$XCODE_VER",
              "bazel": "9.2.0:dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6",
              "macos": "$MACOS_VER"
          }
          EOF
          echo "=== 修改后 versions.json ==="
          cat versions.json

      - name: 写入构建配置
        script: |
          set -e
          cd "$WORKDIR"
          mkdir -p build-system/Make
          cat > build-system/Make/Configuration.json <<EOF
          {
            "bundle_id": "com.local.telegramzh",
            "api_id": "${TG_API_ID}",
            "api_hash": "${TG_API_HASH}",
            "team_id": "",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          cat build-system/Make/Configuration.json

      - name: 编译
        script: |
          set -e
          cd "$WORKDIR"
          echo "=== 签名相关可用参数 ==="
          python3 build-system/Make/Make.py build --help 2>&1 | head -50 || true
          echo ""
          echo "=== 开始编译 ==="
          python3 build-system/Make/Make.py \
            --cacheDir="$WORKDIR/.bazel-cache" \
            build --buildNumber=$BUILD_NUMBER \
            --configurationPath=build-system/Make/Configuration.json \
            --configuration=release_arm64 \
            --xcodeManagedCodesigning

      - name: 定位产物
        script: |
          set -e
          cd "$WORKDIR"
          echo "--- 搜索 .app / .ipa ---"
          find build -maxdepth 6 \( -name '*.app' -o -name '*.ipa' \) 2>/dev/null | head -20
          ls -la build/artifacts 2>/dev/null || echo "no artifacts dir"
          echo "--- build 目录结构 ---"
          find build -maxdepth 3 -type d 2>/dev/null | head -30

      - name: 打包 IPA
        script: |
          set -e
          cd "$WORKDIR"
          mkdir -p out
          if ls build/artifacts/*.ipa >/dev/null 2>&1; then
            cp build/artifacts/*.ipa out/
          else
            APP=$(find build -maxdepth 6 -name '*.app' -type d | grep -v Framework | head -1)
            echo "APP=$APP"
            if [ -n "$APP" ]; then
              mkdir -p out/Payload
              cp -R "$APP" out/Payload/
              cd out && zip -qry TelegramZH.ipa Payload
            fi
          fi
          ls -lah out/ || true

    artifacts:
      - /Users/builder/telegram-build/out/*.ipa
      - /Users/builder/telegram-build/build/artifacts/*.ipa
      - /Users/builder/telegram-build/build/**/*.app
