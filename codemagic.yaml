# codemagic.yaml —— Telegram-iOS 13.0.0 + 自动汉化补丁（对齐官方 CI 的无账号编译流程）
#
# 依据：官方 .github/workflows/build.yml（release-13.0.0 tag 自带），
# 官方 CI 在无证书 runner 上用 fake-codesigning 出 unsigned IPA。
# 本配置 = 官方流程 + AutoZH 补丁 + Codemagic runner。
#
# 环境匹配验证：release-13.0.0 官方要求 Xcode 26.6 / macOS 26，
# Codemagic mac_mini_m2 (xcode latest = 26.6) 原生一致，无需版本覆盖。
# 6 个补丁锚点已在 release-13.0.0 上逐一验证 MATCH。
#
# 产物：unsigned Telegram.ipa → Sideloadly 用免费 Apple ID 重签安装。

workflows:
  telegram-zh:
    name: Telegram ZH (AutoZH patch)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        TELEGRAM_REF: "release-13.0.0"
        WORKDIR: "/Users/Shared/telegram-ios"

    scripts:
      - name: 环境自检
        script: |
          set -e
          sw_vers
          xcodebuild -version
          python3 --version
          df -h /
          echo "WORKDIR=$WORKDIR"

      - name: 克隆 Telegram-iOS (release-13.0.0)
        script: |
          set -e
          sudo rm -rf "$WORKDIR"
          git clone --recursive --depth 1 --branch "$TELEGRAM_REF" \
            https://github.com/TelegramMessenger/Telegram-iOS.git "$WORKDIR"
          cd "$WORKDIR"
          git log -1 --format='%H %ci'
          echo "--- 关键子模块存在性 ---"
          ls -d submodules/TelegramUI submodules/TranslateUI submodules/TelegramCore build-system/fake-codesigning

      - name: 应用自动汉化补丁（6 处）
        script: |
          set -e
          cd "$WORKDIR"
          AUTOZH_ROOT="$WORKDIR" python3 "$CM_BUILD_DIR/patch/apply_patch.py"
          echo "--- 补丁验证（应各输出 >=1） ---"
          grep -c "AutoZH" submodules/TranslateUI/Sources/Translate.swift
          grep -c "AutoZH" submodules/TranslateUI/Sources/ChatTranslation.swift
          grep -c "AutoZH" submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode/Sources/ChatMessageTextBubbleContentNode.swift
          grep -c "AutoZH" submodules/TelegramCore/Sources/TelegramEngine/Messages/Translate.swift

      - name: 导入自签名证书（官方无账号编译流程）
        script: |
          set -e
          cd "$WORKDIR"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: 续期并重签 fake profiles（修复 ExpirationDate 过期）
        script: |
          set -e
          cd "$WORKDIR"
          python3 "$CM_BUILD_DIR/patch/fix_profiles.py" build-system/fake-codesigning temp.keychain

      - name: 安装 Metal Toolchain（Xcode 26 必需）
        script: |
          set -e
          echo "--- 检查 Metal Toolchain 是否已装 ---"
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -5 || true
          echo "--- 验证 metal 编译器 ---"
          xcrun -f metal || true
          /usr/bin/xcrun metal --version || echo "metal 仍不可用（若失败需检查 runner）"

      - name: 补齐 tdlib 构建依赖（ccache / sysctl 进硬编码 PATH）
        script: |
          set -e
          # td genrule 的 PATH 硬编码为 /bin:/usr/bin:/usr/local/bin
          brew list ccache >/dev/null 2>&1 || brew install ccache
          CCACHE_BIN=$(ls /opt/homebrew/bin/ccache /usr/local/bin/ccache 2>/dev/null | head -1)
          echo "ccache found at: $CCACHE_BIN"
          sudo ln -sf "$CCACHE_BIN" /usr/local/bin/ccache
          sudo ln -sf /usr/sbin/sysctl /usr/local/bin/sysctl
          /usr/local/bin/ccache --version | head -1
          /usr/local/bin/sysctl -n hw.ncpu

      - name: 编译（命令与官方 CI 逐字一致）
        script: |
          set -e
          cd "$WORKDIR"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=$BUILD_NUMBER

      - name: 收集 IPA 与 DSYM（官方 glob）
        script: |
          set -e
          cd "$WORKDIR"
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/"
          done
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/ 2>/dev/null || true
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null || true
          ls -lah "$OUTPUT_PATH/"

    artifacts:
      - /Users/Shared/telegram-ios/build/artifacts/*.ipa
      - /Users/Shared/telegram-ios/build/artifacts/*.zip

    publishing:
      email:
        recipients:
          - 992751305-stack@users.noreply.github.com
        notify:
          success: true
          failure: true
